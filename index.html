<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231e1e1e'/%3E%3Ctext x='50' y='68' font-family='monospace' font-size='52' font-weight='700' fill='%23569cd6' text-anchor='middle'%3E%26lt;/%3E%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sandy Campos — Senior Full Stack Software Engineer. 14+ years building reliable business applications, APIs, backend services, and AI-assisted workflows." />
    <meta name="author" content="Sandy Campos" />

    <!-- Open Graph -->
    <meta property="og:title" content="Sandy Campos — Senior Full Stack Software Engineer" />
    <meta property="og:description" content="14+ years building reliable production systems, APIs, and AI-assisted engineering workflows." />
    <meta property="og:type" content="website" />

    <!-- Fonts: JetBrains Mono for code, Outfit for UI prose -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <title>Sandy Campos — Senior Full Stack Software Engineer</title>
  </head>
  <body>
    <!-- Set the theme before first paint to avoid a flash of the wrong theme. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('scp-theme')
          document.documentElement.setAttribute(
            'data-theme',
            t === 'light' || t === 'dark' ? t : 'dark',
          )
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
